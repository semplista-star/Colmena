name: DB Migrate

# Disparo manual desde la pestaña "Actions" de GitHub.
# Requiere los secrets del repo: DATABASE_URL y DIRECT_URL (Settings -> Secrets and variables -> Actions).
#
# Usa `prisma db push` en vez de `prisma migrate dev`: Prisma bloquea `migrate dev`
# en cualquier entorno no interactivo (es el comportamiento esperado en CI, no un
# fallo transitorio), así que no tiene sentido intentarlo aquí.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # --accept-data-loss: Prisma pide confirmación interactiva para cualquier
      # cambio que PODRÍA perder datos (ej. nueva columna @unique). No hay forma
      # de confirmar interactivamente en CI. ANTES de correr este workflow tras
      # cambiar el schema, revisa a mano si el cambio real implica borrar una
      # columna/tabla con datos - si es así, no lo aceptes a ciegas.
      - name: prisma db push
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Commit package-lock.json (si es nuevo)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add package-lock.json"
            git push
          else
            echo "Nada que comitear."
          fi
