name: DB Migrate

# Disparo manual desde la pestaña "Actions" de GitHub.
# Requiere los secrets del repo: DATABASE_URL y DIRECT_URL (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No hay package-lock.json commiteado todavía (npm ci lo exige y falla sin él),
      # así que usamos npm install y guardamos el lockfile que genera para el futuro.
      - run: npm install

      # Intento "real": crea el historial de migraciones (prisma/migrations/*_init).
      # Necesita permiso para crear una shadow DB temporal en Supabase.
      - name: prisma migrate dev --name init
        id: migrate
        continue-on-error: true
        run: npx prisma migrate dev --name init
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Fallback si Supabase no permite crear la shadow DB: sincroniza el
      # esquema directamente sin generar historial de migraciones.
      - name: fallback -> prisma db push
        if: steps.migrate.outcome == 'failure'
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Commit lockfile y migraciones generadas
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: package-lock.json + migración inicial de prisma"
          git diff --cached --quiet || git push
